<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stichting Lezeren - Woorden</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Base background */
  body {
    overflow: hidden; /* Prevent scrolling */
    margin: 0;
    padding: 0;
    background-image: url('images/bg-horizontal.jpg');
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }

  /* Switch to vertical background on mobile and vertical tablets */
  @media (max-width: 1024px) and (orientation: portrait) {
    body {
      background-image: url('images/bg-vertical.jpg');
    }
  }

  .landing-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* Scattered words container */
  .scattered-cloud {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
  }

  /* Individual words */
  .scattered-word {
    position: absolute;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
    transition: top 0.5s ease, left 0.5s ease, opacity 0.5s ease;
  }

  /* Word image sizing */
  .scattered-word img {
    height: 85px; 
    width: auto;
  }

  .scattered-word.enz-img img {
    height: 55px; 
    opacity: 0.8;
  }

  /* Adjust sizes for phones/tablets */
  @media (max-width: 768px) {
    .scattered-word img {
      height: 50px; 
    }
    .scattered-word.enz-img img {
      height: 30px;
    }
  }

  /* The center logo - No background, No border radius, Off-center */
  .center-logo {
    position: absolute;
    top: 55%;   /* Moved slightly down */
    left: 60%;  /* Moved slightly to the right */
    transform: translate(-50%, -50%);
    z-index: 1000;
    transition: transform 0.3s ease, opacity 0.4s ease;
    cursor: pointer;
    /* Removed background, border-radius, padding, and backdrop-filter */
  }

  .center-logo img {
    width: 250px;
    height: auto;
    display: block;
    /* Added a stronger shadow so the logo stays readable without a background */
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
  }

  @media (max-width: 768px) {
    .center-logo img {
      width: 150px; 
    }
    /* Adjust off-center position for mobile screens */
    .center-logo {
      top: 50%;
      left: 50%;
    }
  }

  .center-logo:hover {
    transform: translate(-50%, -50%) scale(1.05); 
  }

  /* Fade out animation class */
  .fade-out {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
</style>
</head>
<body>

<div class="landing-wrap">

  <!-- SCATTERED WORDS -->
  <div class="scattered-cloud" id="cloud">
    <div class="scattered-word"><img src="images/knutselen.png" alt="knutselen"></div>
    <div class="scattered-word"><img src="images/kabbelen.png" alt="kabbelen"></div>
    <div class="scattered-word"><img src="images/wapperen.png" alt="wapperen"></div>
    <div class="scattered-word"><img src="images/huppelen.png" alt="huppelen"></div>
    <div class="scattered-word"><img src="images/flapperen.png" alt="flapperen"></div>
    <div class="scattered-word"><img src="images/tjotteren.png" alt="tjotteren"></div>
    <div class="scattered-word enz-img"><img src="images/enzovoorts.png" alt="enzovoorts"></div>
  </div>

  <!-- CENTER LOGO LINK -->
  <a href="main-page.html" class="center-logo" id="enter-btn">
    <img src="images/logo.png" alt="Enter Stichting Lezeren">
  </a>

</div>

<script>
  // ==========================================
  // SCATTERING LOGIC (9-ZONE GRID + STRICT EDGE MARGINS)
  // ==========================================
  const container = document.getElementById('cloud');
  const words = Array.from(container.getElementsByClassName('scattered-word'));

  function scatterWords() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    
    // Divide screen into 3x3 grid (9 zones)
    const zoneW = width / 3;
    const zoneH = height / 3;
    
    let availableZones = [0, 1, 2, 3, 4, 5, 6, 7, 8];
    availableZones.sort(() => Math.random() - 0.5);

    // Define the off-center logo position (Must match the CSS percentages)
    const isMobile = width < 768;
    const logoX = isMobile ? (width * 0.5) : (width * 0.6);
    const logoY = isMobile ? (height * 0.5) : (height * 0.55);
    
    // Safe distance from the logo to prevent text overlapping it
    const logoRadius = isMobile ? 130 : 200;
    
    // Margin to keep words away from the very edge of the screen
    const edgeMargin = 60; 

    words.forEach((word) => {
      let validPosition = false;
      let attempts = 0;
      let finalX, finalY;

      while (!validPosition && attempts < 100) {
        let zone = availableZones.length > 0 ? availableZones.pop() : Math.floor(Math.random() * 9);
        
        let col = zone % 3;
        let row = Math.floor(zone / 3);
        
        // Calculate zone boundaries with the edge margin applied
        let minX = (col * zoneW) + edgeMargin;
        let maxX = (col * zoneW) + zoneW - edgeMargin;
        let minY = (row * zoneH) + edgeMargin;
        let maxY = (row * zoneH) + zoneH - edgeMargin;

        // Ensure the zone is actually large enough to fit the margins
        if (minX >= maxX || minY >= maxY) {
            minX = col * zoneW;
            maxX = (col * zoneW) + zoneW;
            minY = row * zoneH;
            maxY = (row * zoneH) + zoneH;
        }

        let x = Math.random() * (maxX - minX) + minX;
        let y = Math.random() * (maxY - minY) + minY;

        // Check distance from the OFF-CENTER logo
        const distToLogo = Math.sqrt(Math.pow(x - logoX, 2) + Math.pow(y - logoY, 2));
        
        if (distToLogo > logoRadius) {
          validPosition = true;
          finalX = x;
          finalY = y;
        }
        attempts++;
      }

      if (validPosition) {
        word.style.left = `${finalX}px`;
        word.style.top = `${finalY}px`;
        word.style.opacity = '1';
      } else {
        word.style.opacity = '0';
      }
    });
  }

  window.addEventListener('load', () => {
    setTimeout(scatterWords, 100);
  });

  window.addEventListener('resize', () => {
    words.forEach(w => w.style.transition = 'none');
    scatterWords();
    setTimeout(() => {
      words.forEach(w => w.style.transition = 'top 0.5s ease, left 0.5s ease, opacity 0.5s ease');
    }, 50);
  });

  // ==========================================
  // PAGE TRANSITION LOGIC
  // ==========================================
  const enterBtn = document.getElementById('enter-btn');
  
  enterBtn.addEventListener('click', function(e) {
    e.preventDefault(); 
    const targetUrl = this.href;
    
    document.body.classList.add('fade-out');
    
    setTimeout(function() {
      window.location.href = targetUrl;
    }, 400);
  });
</script>

</body>
</html>
